<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camtoshop</title>
<meta name="description" content="Manda la foto de tu producto por WhatsApp y recibe un Reel con tu marca, listo para publicar. Send a product photo on WhatsApp and get a Reel in your brand.">
<meta property="og:title" content="Camtoshop">
<meta property="og:description" content="Una foto. Un Reel. Tu marca. One photo. One Reel. Your brand.">
<link rel="icon" href="/estatico/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/estatico/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --tinta: #000; --sol: #ffd23f; --papel: #fff; --chat: #dff6c8; --titular: "Barlow Condensed", "Arial Narrow", sans-serif; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--sol); color: var(--tinta); font: 400 19px/1.5 Barlow, system-ui, sans-serif; overflow-wrap: break-word; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--tinta); outline-offset: 2px; }
  h1, h2, h3, p { margin: 0; }
  .ancho { max-width: 1200px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 48px); }
  header { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-top: 20px; padding-bottom: 20px; }
  .logo { font: 900 32px/1 var(--titular); text-decoration: none; }
  .derecha { display: flex; align-items: center; gap: 16px; font-weight: 600; }
  .idiomas { display: inline-flex; border: 2px solid var(--tinta); border-radius: 4px; overflow: hidden; }
  .idiomas button { border: 0; background: none; padding: 5px 9px; font: 700 14px Barlow, sans-serif; color: inherit; cursor: pointer; }
  .idiomas button[aria-pressed=true] { background: var(--tinta); color: var(--sol); }
  .boton { display: inline-block; padding: 16px 28px; background: var(--tinta); color: var(--sol); font: 800 26px/1 var(--titular); text-decoration: none; border-radius: 4px; }
  .boton:hover { background: var(--papel); color: var(--tinta); box-shadow: inset 0 0 0 3px var(--tinta); }

  .portada { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: clamp(32px, 6vw, 88px); align-items: center; padding-bottom: clamp(40px, 6vw, 72px); }
  h1 { font: 900 clamp(60px, 8.6vw, 124px)/.88 var(--titular); letter-spacing: -.01em; }
  .portada p.lema { max-width: 30em; margin: 24px 0 8px; font-size: clamp(19px, 2vw, 22px); font-weight: 500; line-height: 1.4; }
  .portada p.nota { margin-bottom: 28px; font-weight: 700; }
  .aparato { width: min(340px, 44vh, 34vw); }
  .telefono { background: var(--tinta); padding: 10px; border-radius: 34px; position: relative; }
  .telefono video { display: block; width: 100%; aspect-ratio: 9 / 16; border-radius: 26px; background: #333; object-fit: cover; }
  .sonido { position: absolute; left: 22px; bottom: 22px; background: var(--papel); border: 0; border-radius: 99px; padding: 8px 14px; font: 600 15px Barlow, sans-serif; cursor: pointer; }
  .chat { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; font-size: 16px; line-height: 1.3; font-weight: 500; }
  .globo { padding: 8px 12px; border-radius: 10px; box-shadow: 3px 3px 0 var(--tinta); animation: llega .4s both; }
  .globo.uno { background: var(--chat); align-self: flex-end; animation-delay: .4s; }
  .globo.dos { background: var(--papel); align-self: flex-start; animation-delay: 1.1s; }
  @keyframes llega { from { opacity: 0; transform: translateY(8px); } }

  .blanco { background: var(--papel); padding: clamp(48px, 7vw, 96px) 0; }
  .sin-tope { padding-top: 0; }
  h2 { font: 900 clamp(44px, 6vw, 84px)/.92 var(--titular); max-width: 13em; }
  .pasos { list-style: none; counter-reset: paso; margin: 40px 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px; }
  .pasos li { counter-increment: paso; }
  .pasos li::before { content: counter(paso); display: block; font: 900 80px/.9 var(--titular); }
  h3 { font: 800 30px/1.05 var(--titular); margin: 8px 0; }
  .aspectos { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; margin-top: 40px; }
  .aspectos figure { margin: 0; }
  .aspectos video { display: block; width: 100%; aspect-ratio: 9 / 16; border-radius: 8px; background: var(--tinta); }
  figcaption { margin-top: 10px; }
  figcaption b { display: block; font: 800 26px/1.1 var(--titular); }
  figcaption span { font-size: 16px; line-height: 1.3; display: block; }
  .notas { margin-top: 32px; max-width: 42em; }

  .negro { background: var(--tinta); color: var(--papel); padding: clamp(48px, 7vw, 96px) 0; }
  .razones { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px; margin-top: 40px; }
  .razones h3 { color: var(--sol); }
  .modelos { margin-top: 48px; padding-top: 20px; border-top: 2px solid #555; max-width: 46em; font-size: 16px; color: #d6d4cc; }
  .modelos b { display: block; color: var(--papel); }
  .cierre { padding: clamp(48px, 7vw, 96px) 0 32px; }
  .cierre h2 { margin-bottom: 28px; }
  footer { display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; padding-top: 48px; font-size: 16px; font-weight: 500; }

  @media (max-width: 1000px) { .aspectos { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 760px) {
    .portada, .pasos, .razones { grid-template-columns: minmax(0, 1fr); }
    h1 { font-size: clamp(58px, 18.5vw, 104px); }
    .aparato { width: min(300px, 100%); margin: 0 auto; }
    .boton { display: block; text-align: center; }
    .aspectos { grid-auto-flow: column; grid-auto-columns: 62%; grid-template-columns: none; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 8px; }
    .aspectos figure { scroll-snap-align: start; }
    .pasos { gap: 24px; }
  }
  @media (prefers-reduced-motion: reduce) { .globo { animation: none; } }
</style>
<script src="/estatico/idioma.js"></script>
</head>
<body>
<div class="ancho">
  <header>
    <a class="logo" href="/">Camtoshop</a>
    <div class="derecha">
      <div class="idiomas" role="group" aria-label="Idioma / Language"><button data-idioma="es">ES</button><button data-idioma="en">EN</button></div>
      <a href="/portal?entrar" data-t="entrar">Entrar</a>
    </div>
  </header>
  <section class="portada">
    <div>
      <h1 data-t="hero">Una foto. Un Reel. Tu marca.</h1>
      <p class="lema" data-t="hero_texto"></p>
      <p class="nota" data-t="hero_nota"></p>
      <a class="boton" href="/portal" data-t="crear_cuenta">Crear mi cuenta</a>
    </div>
    <div class="aparato">
      <div class="chat" aria-hidden="true">
        <div class="globo uno" data-t="globo_uno"></div>
        <div class="globo dos" data-t="globo_dos"></div>
      </div>
      <div class="telefono">
        <video id="principal" autoplay muted loop playsinline data-t-alt="video_alt"></video>
        <button class="sonido" id="sonido" data-t="sonido_on"></button>
      </div>
    </div>
  </section>
</div>

<section class="blanco">
  <div class="ancho">
    <h2 data-t="como_titulo"></h2>
    <ol class="pasos">
      <li><h3 data-t="paso1"></h3><p data-t="paso1_t"></p></li>
      <li><h3 data-t="paso2"></h3><p data-t="paso2_t"></p></li>
      <li><h3 data-t="paso3"></h3><p data-t="paso3_t"></p></li>
    </ol>
  </div>
</section>

<section class="blanco sin-tope">
  <div class="ancho">
    <h2 data-t="estilos_titulo"></h2>
    <div class="aspectos" id="aspectos"></div>
    <p class="notas" data-t="estilos_nota"></p>
  </div>
</section>

<section class="negro">
  <div class="ancho">
    <h2 data-t="ti_titulo"></h2>
    <div class="razones">
      <div><h3 data-t="ti_1"></h3><p data-t="ti_1_t"></p></div>
      <div><h3 data-t="ti_2"></h3><p data-t="ti_2_t"></p></div>
      <div><h3 data-t="ti_3"></h3><p data-t="ti_3_t"></p></div>
    </div>
    <p class="modelos"><b data-t="con_que"></b><span data-t="con_que_t"></span></p>
  </div>
</section>

<div class="ancho cierre">
  <h2 data-t="cierre"></h2>
  <a class="boton" href="/portal" data-t="crear_cuenta"></a>
  <footer><span data-t="pie"></span><a href="https://www.instagram.com/camtoshop.app/" rel="noopener">@camtoshop.app</a></footer>
</div>
<script>
  const ESTILOS = ["cine", "revista", "estudio", "noche", "macro", "hogar", "oferta", "analogo", "surreal", "monocromo"];
  const muestra = (id, extension = "mp4") => `/estatico/demo/estilos/${idioma === "es" ? "es" : "en"}/${id}.${extension}`;
  function pintarEstilos() {
    document.getElementById("principal").src = muestra("cine");
    document.getElementById("aspectos").replaceChildren(...ESTILOS.map(id => {
      const figura = document.createElement("figure"), video = document.createElement("video");
      Object.assign(video, { src: muestra(id), poster: muestra(id, "jpg"), controls: true, playsInline: true, preload: "none" });
      const pie = document.createElement("figcaption"), nombre = document.createElement("b"), texto = document.createElement("span");
      nombre.textContent = t("estilo_" + id); texto.textContent = t(`estilo_${id}_c`);
      pie.append(nombre, texto); figura.append(video, pie);
      return figura;
    }));
  }
  document.addEventListener("idioma", pintarEstilos);
  document.addEventListener("DOMContentLoaded", pintarEstilos);
  const video = document.getElementById("principal"), boton = document.getElementById("sonido");
  const rotular = () => { boton.dataset.t = video.muted ? "sonido_on" : "sonido_off"; boton.textContent = t(boton.dataset.t); };
  boton.onclick = () => {
    video.muted = !video.muted;
    rotular();
    if (!video.muted) { video.currentTime = 0; video.play(); }
  };
</script>
</body>
</html>
